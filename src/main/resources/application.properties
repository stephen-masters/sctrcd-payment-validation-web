# The port the README's curl examples use, as the old tomcat7-maven-plugin set-up did.
server.port=9090

# The pages and scripts link to /resources/css/... and /resources/js/..., as
# they did when the files lived in the WAR's resources directory. They are
# served from src/main/resources/static.
spring.mvc.static-path-pattern=/resources/**

# Replaces the CharacterEncodingFilter that web.xml declared: UTF-8, forced.
spring.servlet.encoding.force=true
